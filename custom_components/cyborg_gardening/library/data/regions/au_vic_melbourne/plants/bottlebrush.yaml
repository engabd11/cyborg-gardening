plant: bottlebrush
plant_out: [3, 4, 5, 6, 7, 8, 9, 10, 11]
notes:
  - text: In Melbourne plant natives from autumn through to the end of spring. In frosty spots plant in spring once the cold has passed.
    months: [3, 4, 5, 6, 7, 8, 9, 10, 11]
    sources:
      - https://apsvic.org.au/best-time-to-plant-australian-natives
  - text: Most bottlebrushes flower in spring and summer; some species flower in summer and autumn.
    months: [9, 10, 11, 12, 1, 2]
    sources:
      - https://www.anbg.gov.au/callistemon/
  - text: Prune just behind the spent flowers once flowering finishes, but not just before winter.
    months: [12, 1, 2]
    sources:
      - https://www.anbg.gov.au/callistemon/
      - https://resources.austplants.com.au/stories/a-pruning-tip/
sources:
  - https://apsvic.org.au/best-time-to-plant-australian-natives
  - https://www.anbg.gov.au/callistemon/
