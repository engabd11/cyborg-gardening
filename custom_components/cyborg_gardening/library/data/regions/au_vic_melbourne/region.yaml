id: au_vic_melbourne
name: Melbourne, Victoria
country: au
hemisphere: south
climate: Cool temperate
# Australian meteorological seasons (Bureau of Meteorology).
seasons:
  summer: [12, 1, 2]
  autumn: [3, 4, 5]
  winter: [6, 7, 8]
  spring: [9, 10, 11]
  early_summer: [12]
  mid_summer: [1]
  late_summer: [2]
  early_autumn: [3]
  mid_autumn: [4]
  late_autumn: [5]
  early_winter: [6]
  mid_winter: [7]
  late_winter: [8]
  early_spring: [9]
  mid_spring: [10]
  late_spring: [11]
frost:
  # Months with nights at 2 degrees or less at Melbourne Airport, Viewbank and Moorabbin (BOM averages);
  # most fall in June to August, May, September and October get the odd one.
  months: [5, 6, 7, 8, 9, 10]
  # BOM: a screen reading of 2.2 degrees means the ground is approaching 0 degrees.
  threshold_c: 2.2
  # Morning of the day before the frost night, so the wet soil drains and soaks up a full day of sun.
  water_time: "09:00"
  notes: >-
    Frost forms on clear, still nights and settles in low spots and frost hollows, and the ground can
    reach 0 degrees while the forecast screen temperature is still about 2 degrees. Water the soil well
    on the morning of the day before a frost night: moist soil absorbs and stores more of the day's heat
    and releases it overnight, and watering a day ahead lets the surface drain so it is moist, not
    soggy. Water the soil, not the leaves. Do not run sprinklers over plants at night: ice gives no
    insulation, too little water or stopping partway through the night leaves plants colder than if
    they were left dry, and home sprinklers cannot deliver enough water and can load plants with heavy
    ice. Cover tender plants at dusk with frost cloth, hessian or an old sheet held off the leaves, or an
    upturned pot over seedlings, and remove covers in the morning. If plants are frosted, a gentle spray
    of water before the sun reaches them slows the thaw. Organic mulch slows heat rising from the soil
    at night, so around tender plants in cold spots bare moist soil or gravel holds more warmth. Leave
    frost damaged growth on the plant until frosts are over for the season, as it shields the growth
    beneath.
  sources:
    - https://reg.bom.gov.au/climate/map/frost/what-is-frost.shtml
    - https://reg.bom.gov.au/climate/averages/tables/cw_086282_All.shtml
    - https://reg.bom.gov.au/climate/averages/tables/cw_086068_All.shtml
    - https://reg.bom.gov.au/climate/averages/tables/cw_086077_All.shtml
    - https://www.yates.com.au/garden-hub/problem-solver/other/frost-protection/
    - https://www.awri.com.au/files/attachment/frost-fact-sheet
    - https://agrilifeextension.tamu.edu/wp-content/uploads/2025/03/Protecting-Plants-from-Frosts-Freezes-EHT-048.pdf
    - https://www.fao.org/4/y7223e/y7223e0c.htm
    - https://www.fao.org/4/y7223e/y7223e0d.htm
    - https://gardeningsolutions.ifas.ufl.edu/care/weather/preparing-the-landscape-for-cold-weather/
    - https://www.abc.net.au/gardening/how-to/frosty-reception/102427276
    - https://www.abc.net.au/gardening/how-to/frost-protection/11146932
    - https://www.abc.net.au/gardening/how-to/fighting-frost/9436420
    - https://apsvic.org.au/protect-your-plants-from-frost-damage
heat:
  # BOM climate tables count days at 35 degrees or more; Melbourne averages about 9 to 14 a year.
  threshold_c: 35
  notes: >-
    Melbourne averages about 9 to 14 days a year at 35 degrees or more, mostly December to February.
    Water deeply early in the morning before a forecast hot spell so moisture reaches deep into the
    soil; avoid watering at night, which keeps foliage damp and invites fungal disease. Keep beds
    mulched about 7 cm deep to keep roots cool and cut evaporation, with mulch clear of trunks and
    stems. When temperatures head towards 40 degrees, put temporary shade cloth or old white sheets
    over vegetables and tender plants for the day and take sheets off at night. Move pots into shade
    or group them together, and dunk a heat stressed pot in a bucket of water. If a plant is wilting
    badly, wetting its foliage with fresh, clean water cools it quickly. Do not cut off scorched leaves
    until the hot weather has passed, as they shade the growth beneath.
  sources:
    - https://reg.bom.gov.au/climate/averages/tables/cw_086282_All.shtml
    - https://reg.bom.gov.au/climate/averages/tables/cw_086068_All.shtml
    - https://reg.bom.gov.au/climate/averages/tables/cw_086077_All.shtml
    - https://www.abc.net.au/news/2019-01-17/water-smart-gardening-to-cope-with-hot-dry-summers/10716998
    - https://www.abc.net.au/gardening/how-to/beating-the-heat/9434292
    - https://www.abc.net.au/gardening/how-to/heatwave-affected-plants/9430746
    - https://www.sgaonline.org.au/january-in-your-patch/
    - https://www.sgaonline.org.au/february-in-your-patch/
pests:
  - id: queensland_fruit_fly
    name: Queensland fruit fly
    kind: pest
    # SGA monthly guides flag fruit fly from January to April; it now occurs in many parts of Victoria.
    months: [1, 2, 3, 4]
    hosts: [apple, pear, lemon, lime, mandarin, cumquat, tomato, capsicum, chilli, passionfruit, strawberry]
    signs: Fruit ripens early and drops, with soft spots, stings and creamy white larvae inside that rot it from within.
    prevent: Net fruit after fruit set with mesh no larger than 2 mm, kept off the fruit and sealed at the edges. Pick fruit before it falls, collect fallen and damaged fruit often, and remove old dried fruit from trees. Hang traps to monitor, but never rely on traps alone.
    treat: Spot spray protein bait weekly from 6 to 8 weeks before harvest, again after rain, and for several weeks after harvest. Freeze, boil or otherwise destroy infested fruit before it goes in the bin, and never put it in the compost.
    products: [eco_naturalure, fruit_fly_trap]
    sources:
      - https://www.sgaonline.org.au/queensland-fruit-fly-prevention-and-control/
      - https://www.sgaonline.org.au/january-in-your-patch/
      - https://www.sgaonline.org.au/february-in-your-patch/
      - https://www.sgaonline.org.au/march-in-your-patch/
      - https://www.sgaonline.org.au/april-in-your-patch/
  - id: codling_moth
    name: Codling moth
    kind: pest
    # Overwintering larvae hatch in spring about when the host tree flowers.
    months: [9, 10, 11]
    hosts: [apple, pear]
    signs: Fruit riddled with holes and brown and squishy inside, small holes plugged with brown droppings, and fruit dropping early.
    prevent: Clear loose bark and leaf litter. Wrap trunks in corrugated cardboard bands, remove them every 3 weeks and destroy the pupae. Hang a pheromone trap, bag fruit, check trees every few days and destroy fruit with holes.
    treat: Spray Bacillus thuringiensis when eggs are laid but before fruit is infested.
    products: [dipel]
    sources:
      - https://www.sgaonline.org.au/codling-moth/
  - id: snails_slugs
    name: Snails and slugs
    kind: pest
    # SGA flags them on autumn seedlings; they feed at night and after evening rain.
    months: [4, 5, 6, 7, 8, 9, 10]
    hosts: [lettuce, spinach, broccoli, beans, peas, zucchini, cucumber, carrot, strawberry, basil, parsley, coriander]
    signs: Seedlings chewed to ground level, big holes in leaves and shiny silver trails.
    prevent: Protect fresh seedlings. Put copper strips near the top of pots and raised beds, and ring plants with crushed eggshell or wood shavings. Leave citrus rind halves out as daytime hides and collect snails from them.
    treat: Hand pick by torchlight about 2 hours after sunset, especially on rainy nights, and set beer traps. Snails dislike iron based pellets.
    products: [snail_bait_iron]
    sources:
      - https://www.sgaonline.org.au/snails-slugs/
      - https://www.sgaonline.org.au/may-in-your-patch/
  - id: cabbage_aphid
    name: Cabbage aphid
    kind: pest
    months: [6, 7, 8]
    hosts: [broccoli]
    signs: Clusters on new growth, distorted leaves, sticky honeydew, ants and black sooty mould.
    prevent: Grow alyssum, yarrow and dill nearby to bring in predatory insects.
    treat: Squash by hand, hose off with a strong jet of water, or spray a soap spray under the leaves.
    sources:
      - https://www.sgaonline.org.au/how-to-control-aphids/
advice:
  - text: Water deeply in the early morning a few times a week rather than lightly every day; pots and hanging baskets dry out much faster than beds.
    months: [12, 1, 2]
    sources: [https://www.sgaonline.org.au/january-in-your-patch/, https://www.sgaonline.org.au/february-in-your-patch/]
  - text: Top up mulch to about 7 cm on vegie beds, herbs and ornamentals, after watering and clear of stems.
    months: [1, 2, 3, 4, 5, 6, 7, 10, 11, 12]
    sources:
      - https://www.sgaonline.org.au/january-in-your-patch/
      - https://www.sgaonline.org.au/february-in-your-patch/
      - https://www.sgaonline.org.au/march-in-your-patch/
      - https://www.sgaonline.org.au/may-in-your-patch/
      - https://www.sgaonline.org.au/july-in-your-patch/
      - https://www.sgaonline.org.au/october-in-your-patch/
      - https://www.sgaonline.org.au/november-in-your-patch/
      - https://www.sgaonline.org.au/december-gardening-tips/
  - text: Mulch before summer, once spring rain has soaked in and the soil is damp; late spring is the best time.
    months: [9, 10, 11]
    sources: [https://www.sgaonline.org.au/september-in-your-patch/, https://www.sgaonline.org.au/pdfs/sg_brimbank.pdf]
  - text: Use a soil wetting agent so water stays in the soil longer and closer to plants.
    months: [10, 11]
    sources: [https://www.sgaonline.org.au/pdfs/sg_brimbank.pdf]
  - text: Make movable shade cloth covers ready for hot, high UV and windy days and for holidays.
    months: [11, 12]
    sources: [https://www.sgaonline.org.au/november-in-your-patch/, https://www.sgaonline.org.au/december-gardening-tips/]
  - text: Going away? Set up drip irrigation on a tap timer, mulch pots and stand them in a saucer of water.
    months: [12]
    sources: [https://www.sgaonline.org.au/december-gardening-tips/]
  - text: Wait until temperatures ease before major pruning.
    months: [2]
    sources: [https://www.sgaonline.org.au/february-in-your-patch/]
  - text: Pick off and destroy old dried fruit left on trees so fruit fly cannot breed in it, and do not compost infested fruit.
    months: [3]
    sources: [https://www.sgaonline.org.au/march-in-your-patch/]
  - text: Sow a green manure such as oats, wheat, faba beans or field peas in tired or empty beds.
    months: [4, 5, 6]
    sources: [https://www.sgaonline.org.au/april-in-your-patch/, https://www.sgaonline.org.au/may-in-your-patch/, https://www.sgaonline.org.au/june-in-your-patch/]
  - text: Think about frost protection for young seedlings; offcuts of shade cloth make good frost covers.
    months: [4, 5]
    sources: [https://www.sgaonline.org.au/april-in-your-patch/, https://www.sgaonline.org.au/may-in-your-patch/]
  - text: Check soil moisture before watering in the cool months and water first thing in the morning.
    months: [4, 5, 6]
    sources: [https://www.sgaonline.org.au/april-in-your-patch/, https://www.sgaonline.org.au/may-in-your-patch/, https://www.sgaonline.org.au/june-in-your-patch/]
  - text: Prepare beds for bare root fruit trees with plenty of compost.
    months: [5, 6]
    sources: [https://www.sgaonline.org.au/may-in-your-patch/, https://www.sgaonline.org.au/june-in-your-patch/]
  - text: Bare root season. Plant deciduous fruit trees, roses and vines; August is the last chance.
    months: [7, 8]
    sources: [https://www.sgaonline.org.au/july-in-your-patch/, https://www.sgaonline.org.au/august-in-your-patch/]
  - text: Winter prune deciduous fruit trees, but leave apricots alone. Keep tools clean to stop disease spreading.
    months: [7, 8]
    sources: [https://www.sgaonline.org.au/july-in-your-patch/, https://www.sgaonline.org.au/august-in-your-patch/]
  - text: Improve beds with compost and well rotted manure before spring planting, and give plants coming out of winter a gentle feed such as seaweed.
    months: [9]
    sources: [https://www.sgaonline.org.au/september-in-your-patch/]
  - text: Wait until frost danger has passed before planting frost tender crops such as tomatoes.
    months: [9]
    sources: [https://www.sgaonline.org.au/september-in-your-patch/]
  - text: Cut off shoots growing from below the graft on grafted fruit trees.
    months: [11]
    sources: [https://www.sgaonline.org.au/november-in-your-patch/]
