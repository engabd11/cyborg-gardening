- id: neutrog_sudden_impact_roses
  name: Neutrog Sudden Impact for Roses
  brand: Neutrog
  type: organic_fertiliser
  use: Organic based, boosted pellet fertiliser for roses. Not for natives, bare-rooted or newly planted roses.
  rate: Established roses 100 g per bush after signs of new season growth, then every 8 to 10 weeks through the growing season. Pots 15 g per 150 mm pot, then 5 g per 25 mm pot size increase. Keep at least 20 cm from the base of the plant.
  npk: "9:4:12"
  low_phosphorus: false
