- id: osmocote_native
  name: Scotts Osmocote Native Controlled Release Fertiliser
  brand: Scotts Osmocote
  type: controlled_release
  use: Controlled release plant food for Australian natives and other phosphorus sensitive plants. Feeds for up to 6 months.
  rate: Maintenance 1 tablespoon (15 g) for every 30 cm of plant height, in a band around the dripline, twice a year. Planting 2 tablespoons for a 20 cm pot, 3 for a 25 cm pot, 4 for a 30 cm pot. Beds 50 to 80 g per square metre.
  npk: "21.8:0.7:7.2"
  low_phosphorus: true
