- id: neutrog_bush_tucker
  name: Neutrog Bush Tucker
  brand: Neutrog
  type: organic_fertiliser
  use: Organic based, boosted pellet fertiliser for Australian natives, safe for phosphorus sensitive plants.
  rate: New plantings 50 g per plant in the base of the hole, covered with 1 to 5 cm of soil. Established plants 100 g per plant. Garden beds 100 g per square metre. Pots 30 g per 20 cm pot around the outer rim. Apply after new growth appears, then every 12 weeks or as needed during the growing season, on pre-soaked soil at least 20 cm from the base, and water well.
  npk: "10:0.7:8"
  low_phosphorus: true
  where: [Bunnings, Victorian garden centres]
  url: https://www.bunnings.com.au/neutrog-10kg-bush-tucker-native-fertiliser_p0671779
  label: https://neutrog.com.au/products/bush-tucker/
  sources:
    - https://neutrog.com.au/products/bush-tucker/
